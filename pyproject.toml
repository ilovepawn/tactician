[project]
name = "tactician"
version = "0.1.0"
description = "Chess puzzle service. Vendors lichess-puzzler (AGPL-3.0) for generation and serves puzzles via API."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "chess>=1.11.0",
    "requests>=2.32.0",
    "zstandard>=0.23.0",
    "pymysql[rsa]>=1.1.0",
    "boto3>=1.35.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "dbutils>=3.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tactician"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
