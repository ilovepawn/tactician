name: tactician

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tactician
      MYSQL_USER: tactician
      MYSQL_PASSWORD: tactician
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: changeme123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot batch worker. Not started by `docker compose up` — invoke with
  #   docker compose run --rm batch --date YYYY-MM-DD
  #   docker compose run --rm batch --file /mnt/lichess/<dump>.pgn.zst --max-games 200
  # Mount any host directory holding ad-hoc PGN dumps via LICHESS_DUMP_DIR
  # (defaults to ./data so missing dirs don't fail compose parse).
  batch:
    build: .
    image: tactician:latest
    profiles: ["batch"]
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: tactician
      MYSQL_PASSWORD: tactician
      MYSQL_DATABASE: tactician
      S3_ENDPOINT_URL: http://s3:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: changeme123
      S3_BUCKET_GAMES: games
      STOCKFISH_PATH: /usr/local/bin/stockfish
      STOCKFISH_THREADS: "4"
    volumes:
      - ${LICHESS_DUMP_DIR:-./data}:/mnt/lichess:ro

  # Long-running HTTP API. Same image as batch — different command.
  api:
    build: .
    image: tactician:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: tactician
      MYSQL_PASSWORD: tactician
      MYSQL_DATABASE: tactician
      # api doesn't need S3/Stockfish, but config.load_config() requires
      # all keys to be present. Stub them out.
      S3_ENDPOINT_URL: http://s3:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: changeme123
      S3_BUCKET_GAMES: games
      STOCKFISH_PATH: /usr/local/bin/stockfish
      STOCKFISH_THREADS: "1"
    ports:
      - "8000:8000"
    entrypoint: ["uv", "run", "--no-sync", "uvicorn", "tactician.api:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  mysql_data:
  minio_data:
